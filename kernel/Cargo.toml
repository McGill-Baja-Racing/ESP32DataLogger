[workspace]
members = ["sys", "macros", "esp-hosted"]
exclude = ["vendor/edge-nal-embassy"]

[package]
name = "baja-kernel"
edition = "2024"

# The `test` crate does not exist for bare-metal targets.
[[bin]]
name = "baja-kernel"
test = false
bench = false

[features]
default = ["esp32c3"]
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-rtos/esp32c3",
    "esp-alloc/esp32c3",
    "esp-println/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-backtrace/esp32c3",
]
esp32p4 = [
    "esp-hal/esp32p4",
    "esp-rtos/esp32p4",
    "esp-alloc/esp32p4",
    "esp-alloc/internal-heap-stats",
    "esp-println/esp32p4",
    "esp-bootloader-esp-idf/esp32p4",
    "esp-backtrace/esp32p4",
    "esp-rtos/embassy",
    "dep:fatfs",
    "dep:edge-dhcp",
    "dep:edge-http",
    "dep:edge-nal",
    "dep:edge-nal-embassy",
    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:embassy-net",
    "dep:embassy-net-esp-hosted",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embedded-io-async",
]

# The firmware to build; one at a time.
brake = ["esp32c3"]
mpu = ["esp32c3"]
encoder = ["esp32c3"]
engine = ["esp32c3"]
engine-bench = ["esp32c3"]
adc = ["esp32c3"]
engine-rpm-sim = ["esp32c3"]
wheel-rpm-sim = ["esp32c3"]
master = ["esp32p4"]
master-no-can = ["esp32p4"]

[dependencies]
esp-hal = { version = "=1.2.2", features = ["unstable"] }
esp-rtos = { version = "=0.4.0", features = ["esp-radio"] }
esp-alloc = "=0.11.0"
esp-radio-rtos-driver = "=0.4.2"
critical-section = "=1.2.0"
portable-atomic = "=1.15.0"
printf-compat = { version = "=0.5.0", default-features = false }
# Without its `critical-section` feature, printing leaves interrupts on; `esp_log` locks lines.
esp-println = { version = "=0.18.0", default-features = false, features = ["auto", "colors"] }
esp-bootloader-esp-idf = "=0.6.0"
esp-backtrace = { version = "=0.20.0", features = ["panic-handler", "println", "custom-halt"] }
fatfs = { git = "https://github.com/rafalh/rust-fatfs", rev = "2aefc2a027ce94ed0671752814dac203f0450e11", default-features = false, features = ["alloc", "lfn"], optional = true }
edge-dhcp = { version = "=0.8.0", default-features = false, features = ["io"], optional = true }
edge-http = { version = "=0.8.0", default-features = false, features = ["io"], optional = true }
edge-nal = { version = "=0.7.0", default-features = false, optional = true }
# Vendored for one fix: its `accept` unwraps a connection that was reset after the handshake.
edge-nal-embassy = { path = "vendor/edge-nal-embassy", default-features = false, features = ["proto-ipv4", "medium-ethernet", "tcp", "udp"], optional = true }
embassy-executor = { version = "=0.10.0", optional = true }
embassy-futures = { version = "=0.1.2", optional = true }
embassy-net = { version = "=0.9.1", features = ["proto-ipv4", "medium-ethernet", "tcp", "udp"], optional = true }
embassy-net-esp-hosted = { path = "esp-hosted", optional = true }
embassy-sync = { version = "=0.8.0", optional = true }
embassy-time = { version = "=0.5.1", optional = true }
embedded-io-async = { version = "=0.7.0", optional = true }
sys = { package = "baja-sys", path = "sys" }
macros = { package = "baja-macros", path = "macros" }

[lints]
workspace = true

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "warn"

[profile.dev]
# esp-hal is too slow unoptimized.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "z"
