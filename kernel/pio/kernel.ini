; Settings for building C firmware on the Rust kernel. A project includes this file with
; `extra_configs`, its envs extend the chip's section and add `extra_scripts = post:<path>/cargo.py`.

[kernel]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
monitor_speed = 115200
; The platform's bare-metal flags include this Xtensa-only option.
build_unflags = -mlongcalls
; cargo.py links only the compiled C files, not libraries PlatformIO would archive.
lib_archive = no
upload_protocol = custom
upload_command = espflash flash --chip $BOARD_MCU "$PROGPATH"

; The C flags must match the cargo target's ISA and ABI. They are in board_build so an env's own
; build_flags can't drop them; the -Wa, copies also reach assembly (.S) files.
[kernel_esp32c3]
extends = kernel
board = esp32-c3-devkitm-1
board_build.extra_flags = -march=rv32imc_zicsr_zifencei -mabi=ilp32 -Wa,-march=rv32imc_zicsr_zifencei -Wa,-mabi=ilp32
custom_cargo_target = riscv32imc-unknown-none-elf

[kernel_esp32p4]
extends = kernel
board = esp32-p4
board_build.extra_flags = -march=rv32imafc_zicsr_zifencei -mabi=ilp32f -Wa,-march=rv32imafc_zicsr_zifencei -Wa,-mabi=ilp32f
custom_cargo_target = riscv32imafc-unknown-none-elf
