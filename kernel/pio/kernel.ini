; Settings for building C firmware on the Rust kernel. A project includes this file with
; `extra_configs`, its envs extend the chip's section and add `extra_scripts = post:<path>/cargo.py`.

[kernel]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; ESP-IDF itself is not built; the C compiles against its unmodified headers.
platform_packages = framework-espidf
monitor_speed = 115200
; Replaces the platform's bare-metal flags that don't match ESP-IDF: Xtensa-only, and an older C.
build_unflags = -mlongcalls -std=gnu99
; cargo.py links only the compiled C files, not libraries PlatformIO would archive.
lib_archive = no
upload_protocol = custom
; espflash flashes and makes both images, all with the board's flash settings. espflash spells
; them 2mb and 80mhz where the board has 2MB and 80m; cargo.py sets $ESPFLASH_FLASH_SIZE.
custom_espflash_args = --chip $BOARD_MCU --flash-mode ${__get_board_flash_mode(__env__)} --flash-freq ${__get_board_f_image(__env__)}hz --flash-size $ESPFLASH_FLASH_SIZE
upload_command = "$ESPFLASH" flash ${kernel.custom_espflash_args} ${UPLOAD_PORT and ["--port", UPLOAD_PORT]} "$PROGPATH"
custom_elf2bin = "$ESPFLASH" save-image ${kernel.custom_espflash_args} "$SOURCE" "$TARGET"
; Bootloader, partition table and app, to flash at 0.
custom_factory_bin = "$ESPFLASH" save-image --merge --skip-padding ${kernel.custom_espflash_args} "$PROGPATH" "$BUILD_DIR/${PROGNAME}.factory.bin"
; cargo.py builds it into cargo's target folder, under this name, on the first build.
custom_espflash = espflash@4.6.0
; The size check matches ESP-IDF's section names; these are esp-hal's.
custom_size_prog_regexp = ^(?:\.trap|\.rwtext|\.data|\.flash\.appdesc|\.rodata|\.text)\s+(\d+).*
custom_size_data_regexp = ^(?:\.data|\.bss|\.noinit)\s+(\d+).*
; Debug info and frame pointers, as ESP-IDF's CONFIG_ESP_SYSTEM_USE_FRAME_POINTER sets them, so a
; Rust panic's backtrace continues through the C callers.
custom_c_flags = -ggdb -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer
custom_idf = ${platformio.packages_dir}/framework-espidf/components
; The ESP-IDF header folders the firmware needs on every chip.
custom_idf_includes =
    -I${kernel.custom_idf}/newlib/platform_include
    -I${kernel.custom_idf}/freertos/config/include
    -I${kernel.custom_idf}/freertos/config/include/freertos
    -I${kernel.custom_idf}/freertos/config/riscv/include
    -I${kernel.custom_idf}/freertos/FreeRTOS-Kernel/include
    -I${kernel.custom_idf}/freertos/FreeRTOS-Kernel/portable/riscv/include/freertos
    -I${kernel.custom_idf}/freertos/esp_additions/include
    -I${kernel.custom_idf}/esp_hw_support/include
    -I${kernel.custom_idf}/heap/include
    -I${kernel.custom_idf}/log/include
    -I${kernel.custom_idf}/hal/platform_port/include
    -I${kernel.custom_idf}/hal/include
    -I${kernel.custom_idf}/esp_rom/include
    -I${kernel.custom_idf}/esp_common/include
    -I${kernel.custom_idf}/esp_system/include
    -I${kernel.custom_idf}/riscv/include
    -I${kernel.custom_idf}/esp_adc/include
    -I${kernel.custom_idf}/esp_driver_gpio/include
    -I${kernel.custom_idf}/esp_driver_i2c/include
    -I${kernel.custom_idf}/esp_driver_twai/include
    -I${kernel.custom_idf}/esp_timer/include

; The C flags must match the cargo target's ISA and ABI. They are in board_build so an env's own
; build_flags can't drop them; the -Wa, copies also reach assembly (.S) files.
[kernel_esp32c3]
extends = kernel
board = esp32-c3-devkitm-1
board_build.extra_flags =
    -std=gnu17 -march=rv32imc_zicsr_zifencei -mabi=ilp32 -Wa,-march=rv32imc_zicsr_zifencei -Wa,-mabi=ilp32
    ${kernel.custom_c_flags}
    ${kernel.custom_idf_includes}
    -I${kernel.custom_idf}/soc/esp32c3/include
    -I${kernel.custom_idf}/soc/esp32c3/register
    -I${kernel.custom_idf}/esp_adc/esp32c3/include
custom_cargo_target = riscv32imc-unknown-none-elf

[kernel_esp32p4]
extends = kernel
board = esp32-p4
board_build.extra_flags =
    -std=gnu17 -march=rv32imafc_zicsr_zifencei -mabi=ilp32f -Wa,-march=rv32imafc_zicsr_zifencei -Wa,-mabi=ilp32f
    ${kernel.custom_c_flags}
    ${kernel.custom_idf_includes}
custom_cargo_target = riscv32imafc-unknown-none-elf
