; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
; Production P4 v3.x (ECO7), rather than the pre-v3 engineering-sample target.
board = esp32-p4_r3
; Preserve the existing 2MB firmware layout; do not assume the generic board's 16MB flash.
board_upload.flash_size = 2MB
framework = espidf
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter
