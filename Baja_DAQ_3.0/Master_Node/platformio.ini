; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Master]
extra_scripts = pre:tools/web_asset_dependencies.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = espidf
monitor_speed = 115200
monitor_filters = send_on_enter
board_upload.flash_size = 2MB
board_build.partitions = partitions.csv
build_flags =
    -D MASTER_CAN_BITRATE=1000000
    -D SD_FORMAT_IF_MOUNT_FAILED=0

board_build.esp-idf.components =
    fatfs
    sdmmc
    esp_driver_sdmmc
    esp_driver_uart
    esp_http_server
    esp_netif
    esp_event
    nvs_flash

[env:MasterStable]
extends = env:Master

[env:MasterNoCAN]
extends = env:MasterStable
build_flags =
    ${env:Master.build_flags}
    -D MASTER_CAN_ENABLED=0
