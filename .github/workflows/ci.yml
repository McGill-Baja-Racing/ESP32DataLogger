name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  firmware:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [master-node, sensor-node, simulators/engine-rpm, simulators/wheel-rpm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('**/platformio.ini') }}
      # The latest Core, like the one PlatformIO IDE installs.
      - run: pip install platformio
      - name: Build every environment
        run: pio run -d ${{ matrix.project }}

  checks:
    name: Host tests and platform pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Master node host tests
        run: python3 -m unittest discover -s master-node/tests
      - name: Every project pins the same PlatformIO platform
        run: |
          grep -h '^platform *=' */platformio.ini simulators/*/platformio.ini | sort -u | tee platforms.txt
          test "$(wc -l < platforms.txt)" -eq 1
